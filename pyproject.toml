[project]
name = "fastapi-devplay"
version = "0.1.0"
description = "API REST de DevPlay (FastAPI + SQLAlchemy 2.0 + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` en argumentos es el patrón estándar de FastAPI
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Las plantillas HTML de correo son bloques largos a propósito
"app/utils/mailer.py" = ["E501"]
# El prompt de Pixel se copia literal de devplay-main (textos en una sola línea)
"app/services/buddy_service.py" = ["E501"]
