services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erick
      POSTGRES_PASSWORD: devplay
      POSTGRES_DB: devplay_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erick -d devplay_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://erick:devplay@db:5432/devplay_api
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
      APP_ENV: ${APP_ENV:-dev}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
